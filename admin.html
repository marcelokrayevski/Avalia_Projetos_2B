<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Professor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Painel do Professor</h1>
      <p>Relatório de Notas das Apresentações</p>
    </header>

    <div id="login-block">
      <div class="form-group">
        <label for="admin-pass">Senha de Acesso:</label>
        <input type="password" id="admin-pass" placeholder="Digite a senha">
      </div>
      <button id="btn-login" type="button">Acessar Painel</button>
    </div>

    <div id="admin-content" style="display: none;">
      <div class="admin-actions">
        <button id="btn-pdf" type="button">Baixar Relatório (PDF)</button>
        <button id="btn-zerar" type="button" class="btn-danger">Zerar Todos os Dados</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Mesa</th>
            <th>Aluno</th>
            <th>Acertos</th>
            <th>Nota</th>
            <th>Data/Hora</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
